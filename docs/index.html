  --dark2:  #111827;

  --text:   #c8d6e5;

  --accent: #4fc3f7;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Courier New', Courier, monospace;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── TUNNEL OVERLAY ── */
#tunnel-overlay {
  position: fixed; inset: 0; z-index: 9999;
  pointer-events: none; opacity: 0;
  transition: opacity 0.3s;
  background: radial-gradient(ellipse at center,
    rgba(79,195,247,0.02) 0%,
    rgba(10,14,23,0) 70%);
}
#tunnel-overlay.active { pointer-events: all; opacity: 1; }
#tunnel-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
}

/* ── GRID BACKGROUND ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(69,123,157,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(69,123,157,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

/* ── HEADER ── */
#header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(10,14,23,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1.5rem;
  display: flex; align-items: center; gap: 1rem;
  flex-wrap: wrap;
}
#header h1 {
  font-size: 1rem; font-weight: 700; letter-spacing: 0.05em;
  color: var(--accent);
  text-shadow: 0 0 20px rgba(79,195,247,0.4);
}
.status-badge {
  font-size: 0.7rem; padding: 2px 8px; border-radius: 2px;
  border: 1px solid;
  letter-spacing: 0.08em; font-weight: 700;
}
.badge-active { color: var(--ok); border-color: var(--ok); }
.badge-warn   { color: var(--warn); border-color: var(--warn); }
.badge-void   { color: var(--void); border-color: var(--void); }

#search-input {
  margin-left: auto;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 12px; border-radius: 2px;
  font-family: inherit; font-size: 0.8rem;
  width: 220px; outline: none;
  transition: border-color 0.2s;
}
#search-input:focus { border-color: var(--accent); }

/* ── MAIN LAYOUT ── */
#layout { display: flex; min-height: calc(100vh - 52px); }

/* ── SIDEBAR ── */
#sidebar {
  width: 280px; flex-shrink: 0;
  border-right: 1px solid var(--border);
  padding: 1rem 0;
  position: sticky; top: 52px;
  height: calc(100vh - 52px);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.sidebar-group { margin-bottom: 0.5rem; }
.sidebar-group-title {
  font-size: 0.65rem; letter-spacing: 0.12em; font-weight: 700;
  color: var(--muted);
  padding: 0.4rem 1rem 0.3rem;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 1rem 5px 1.5rem;
  cursor: pointer;
  font-size: 0.78rem; color: var(--text);
  border-left: 2px solid transparent;
  transition: all 0.15s;
  text-decoration: none;
  position: relative;
}
.nav-item:hover { background: var(--glow); color: var(--accent); border-left-color: var(--accent); }
.nav-item.active { color: var(--accent); border-left-color: var(--accent); background: var(--glow); }
.nav-item .dot {
  width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
}
.dot-ok   { background: var(--ok); }
.dot-void { background: var(--void); }
.dot-raw  { background: var(--warn); }
.nav-status { margin-left: auto; font-size: 0.62rem; opacity: 0.7; }

/* ── CONTENT PANE ── */
#content { flex: 1; padding: 2rem; max-width: 900px; }

/* ── PAGE RENDERER ── */
#page-container {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2rem;
  min-height: 400px;
  transition: opacity 0.3s;
}
#page-container.loading { opacity: 0.4; }

/* ── MARKDOWN RENDERED STYLES ── */
#md-output h1 {

  padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
  letter-spacing: 0.03em;
}
#md-output h2 {
  font-size: 1.1rem; color: var(--ok); margin: 1.5rem 0 0.75rem;

}
#md-output h3 { font-size: 0.95rem; color: var(--warn); margin: 1rem 0 0.5rem; }
#md-output p { font-size: 0.88rem; line-height: 1.75; margin-bottom: 0.85rem; color: var(--text); }
#md-output strong { color: var(--accent); }
#md-output em { color: var(--warn); font-style: italic; }
#md-output ul, #md-output ol { padding-left: 1.4rem; margin-bottom: 0.85rem; }
#md-output li { font-size: 0.85rem; line-height: 1.7; margin-bottom: 0.25rem; }
#md-output table { width: 100%; border-collapse: collapse; font-size: 0.78rem; margin: 1rem 0; }
#md-output th {
  background: rgba(69,123,157,0.2); color: var(--accent);
  padding: 6px 10px; text-align: left; border: 1px solid var(--border);
}
#md-output td { padding: 5px 10px; border: 1px solid var(--border); color: var(--text); }
#md-output tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
#md-output code {
  background: rgba(79,195,247,0.08); color: var(--accent);
  padding: 1px 5px; border-radius: 2px; font-size: 0.82rem;
}
#md-output pre {
  background: rgba(0,0,0,0.4); border: 1px solid var(--border);
  padding: 1rem; border-radius: 4px; overflow-x: auto;
  font-size: 0.78rem; margin: 0.85rem 0;
}
#md-output blockquote {
  border-left: 3px solid var(--accent); margin: 1rem 0;
  padding: 0.5rem 1rem; background: rgba(79,195,247,0.04);
  font-size: 0.85rem; color: var(--muted);
}
#md-output hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
#md-output a { color: var(--accent); text-decoration: none; }
#md-output a:hover { text-decoration: underline; }

/* ── PAGE HEADER META ── */
.page-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 1.5rem; padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.page-meta .path {
  font-size: 0.72rem; color: var(--muted);
  font-family: 'Courier New', monospace;
}
.meta-btn {
  margin-left: auto; font-size: 0.72rem;
  padding: 3px 10px; border: 1px solid var(--border);
  border-radius: 2px; cursor: pointer;
  color: var(--muted); background: transparent;
  font-family: inherit; transition: all 0.15s;
  text-decoration: none; display: inline-block;
}
.meta-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── LOADING SPINNER ── */
.spinner {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── INDEX GRID (home) ── */
.index-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px; margin-top: 1rem;
}
.index-card {
  background: var(--dark2); border: 1px solid var(--border);
  border-radius: 4px; padding: 1rem; cursor: pointer;
  transition: all 0.2s; position: relative; overflow: hidden;
}
.index-card::before {
  content: ''; position: absolute; top: 0; left: 0;
  width: 3px; height: 100%;
}
.index-card.ok::before { background: var(--ok); }
.index-card.void::before { background: var(--void); }
.index-card.raw::before { background: var(--warn); }
.index-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 4px 20px rgba(79,195,247,0.1); }
.index-card .card-title { font-size: 0.82rem; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.index-card .card-path { font-size: 0.65rem; color: var(--muted); word-break: break-all; }
.index-card .card-status {
  position: absolute; top: 8px; right: 8px;
  font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em;
}
.index-card.ok .card-status { color: var(--ok); }
.index-card.void .card-status { color: var(--void); }
.index-card.raw .card-status { color: var(--warn); }

/* ── STATS BAR ── */

  font-size: 0.78rem; color: var(--muted);
  margin-bottom: 1.5rem;

.stat-item strong { color: var(--text); font-size: 1rem; }

/* ── TUNNEL LABEL ── */
#tunnel-label {

  z-index: 10000; font-size: 0.8rem; color: var(--accent);
  letter-spacing: 0.15em; font-weight: 700;
  opacity: 0; transition: opacity 0.2s;
  text-shadow: 0 0 20px var(--accent);
  pointer-events: none;
}
#tunnel-label.active { opacity: 1; }
</style>

// ════════════════════════════════════════════
// TUNNEL ENGINE
// ════════════════════════════════════════════
const canvas = document.getElementById('tunnel-canvas');
const ctx = canvas.getContext('2d');
let tunnelAnim = null;
let tunnelActive = false;

function startTunnel(cb) {
  if (tunnelActive) { cb && cb(); return; }
  tunnelActive = true;
  const overlay = document.getElementById('tunnel-overlay');
  const label = document.getElementById('tunnel-label');
  overlay.classList.add('active');
  label.classList.add('active');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  let t = 0;

  function drawFrame() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(10,14,23,0.85)';
    ctx.fillRect(0, 0, W, H);

    const rings = 18;
    for (let i = 0; i < rings; i++) {
      const progress = ((i / rings) + (t * 0.04)) % 1;
      const r = Math.pow(progress, 1.5) * Math.min(W, H) * 0.85;
      const alpha = (1 - progress) * 0.7;
      const sides = 6;

      ctx.beginPath();
      for (let s = 0; s <= sides; s++) {
        const angle = (s / sides) * Math.PI * 2 - Math.PI / 6 + (t * 0.005);
        const px = cx + r * Math.cos(angle);
        const py = cy + r * Math.sin(angle);
        s === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.strokeStyle = `rgba(79,195,247,${alpha})`;
      ctx.lineWidth = 0.5 + (1 - progress);
      ctx.stroke();

      // Cross lines
      if (i % 3 === 0) {
        const angle2 = (t * 0.01 + i * 0.4);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + r * Math.cos(angle2), cy + r * Math.sin(angle2));
        ctx.strokeStyle = `rgba(79,195,247,${alpha * 0.3})`;
        ctx.lineWidth = 0.3;
        ctx.stroke();
      }
    }

    // Center glow
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60);
    grad.addColorStop(0, 'rgba(79,195,247,0.3)');
    grad.addColorStop(1, 'rgba(79,195,247,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    t++;
    tunnelAnim = requestAnimationFrame(drawFrame);
  }
  drawFrame();

  setTimeout(() => {
    stopTunnel();
    cb && cb();
  }, 700);
}

function stopTunnel() {
  tunnelActive = false;
  cancelAnimationFrame(tunnelAnim);
  const overlay = document.getElementById('tunnel-overlay');
  const label = document.getElementById('tunnel-label');
  overlay.classList.remove('active');
  label.classList.remove('active');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ════════════════════════════════════════════
// MARKDOWN PARSER (minimal)
// ════════════════════════════════════════════
function parseMarkdown(md) {
  let html = md
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    // code blocks
    .replace(/```[\w]*\n([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    // inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    // hr
    .replace(/^---+$/gm, '<hr>')
    // bold+italic
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/_(.+?)_/g, '<em>$1</em>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
    // tables
    .replace(/^\|(.+)\|$/gm, (_, row) => {
      if (row.match(/^[\s\-|]+$/)) return '<tr data-sep></tr>';
      const cells = row.split('|').map(c => c.trim());
      return '<tr>' + cells.map(c => `<td>${c}</td>`).join('') + '</tr>';
    })
    // lists
    .replace(/^\* (.+)$/gm, '<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // blockquote
    .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
    // paragraphs
    .replace(/\n\n/g, '</p><p>');

  // Wrap table rows
  html = html.replace(/(<tr[^>]*>.*?<\/tr>\s*)+/gs, m => {
    const rows = m.split('</tr>').filter(r => r.trim());
    let out = '<table>';
    rows.forEach((r, i) => {
      if (r.includes('data-sep')) return;
      if (i === 0) out += '<thead>' + r.replace(/td>/g,'th>') + '</tr></thead><tbody>';
      else out += r + '</tr>';
    });
    return out + '</tbody></table>';
  });

  // Wrap li
  html = html.replace(/(<li>.*?<\/li>\s*)+/gs, m => `<ul>${m}</ul>`);

  return '<p>' + html + '</p>';
}

// ════════════════════════════════════════════
// NAVIGATION ENGINE
// ════════════════════════════════════════════
let currentPage = null;

function navigateTo(pageId) {
  const page = PAGES.find(p => p.id === pageId);
  if (!page) return;

  startTunnel(() => {
    renderPage(page);
  });

  // Update active in sidebar
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === pageId);
  });
}

function renderPage(page) {
  currentPage = page;
  const container = document.getElementById('page-container');
  const output = document.getElementById('md-output');
  const pathEl = document.getElementById('page-path');
  const rawBtn = document.getElementById('raw-btn');

  container.classList.add('loading');
  pathEl.textContent = '/' + page.path;
  rawBtn.href = RAW + page.path;

  if (page.id === 'home') {
    renderHome();
    container.classList.remove('loading');
    return;
  }

  if (page.status === 'ok') {
    // Live HTML page — open in tunnel frame or link
    output.innerHTML = `
      <div style="text-align:center; padding: 2rem 0;">
        <div style="font-size:2rem; margin-bottom:1rem;">⚡</div>
        <div style="color:var(--ok); font-size:0.9rem; margin-bottom:0.5rem; font-weight:700;">LIVE HTML PAGE</div>
        <div style="color:var(--muted); font-size:0.8rem; margin-bottom:1.5rem;">${page.path}</div>
        <a href="${SITE}${page.path}" target="_blank" class="meta-btn" style="font-size:0.85rem; padding:8px 20px; color:var(--accent); border-color:var(--accent);">
          ↗ ОТКРЫТЬ СТРАНИЦУ
        </a>
        <div style="margin-top:1rem;">
          <a href="${RAW}${page.path}" target="_blank" class="meta-btn">↗ RAW SOURCE</a>
        </div>
        ${page.desc ? `<p style="margin-top:1.5rem; color:var(--muted); font-size:0.78rem; max-width:400px; margin-left:auto; margin-right:auto;">${page.desc}</p>` : ''}
      </div>`;
    container.classList.remove('loading');
    return;
  }

  // RAW fetch from GitHub
  const rawUrl = RAW + page.path;
  fetch(rawUrl)
    .then(r => {
      if (!r.ok) throw new Error('404');
      return r.text();
    })
    .then(text => {
      const ext = page.path.split('.').pop().toLowerCase();
      if (ext === 'md') {
        output.innerHTML = parseMarkdown(text);
      } else if (ext === 'json') {
        output.innerHTML = `<pre style="white-space:pre-wrap; word-break:break-all;">${text}</pre>`;
      } else if (ext === 'txt') {
        output.innerHTML = `<pre style="white-space:pre-wrap;">${text}</pre>`;
      } else {
        output.innerHTML = parseMarkdown(text);
      }
      container.classList.remove('loading');
    })
    .catch(() => {
      output.innerHTML = `
        <div style="text-align:center; padding:2rem;">
          <div style="font-size:2rem; color:var(--void); margin-bottom:0.75rem;">⚠</div>
          <div style="color:var(--void); font-weight:700; margin-bottom:0.5rem;">ЛОКАЛЬНЫЙ ФАЙЛ (не в GitHub Pages)</div>
          <div style="color:var(--muted); font-size:0.78rem; margin-bottom:1.5rem;">${page.path}</div>
          <a href="${rawUrl}" target="_blank" class="meta-btn" style="border-color:var(--warn); color:var(--warn);">
            ↗ ПОПРОБОВАТЬ RAW GITHUB
          </a>
          <div style="margin-top:0.75rem;">
            <a href="${SITE}${page.path}" target="_blank" class="meta-btn">↗ ПОПРОБОВАТЬ SITE</a>
          </div>
          <p style="margin-top:1.5rem; color:var(--muted); font-size:0.72rem;">
            Файл может быть доступен только в локальном репозитории.<br>
            Добавьте его в GitHub Pages для публикации.
          </p>
        </div>`;
      container.classList.remove('loading');
    });
}

function renderHome() {
  const output = document.getElementById('md-output');
  const groups = {};
  PAGES.forEach(p => {
    if (!groups[p.group]) groups[p.group] = [];
    groups[p.group].push(p);
  });

  const voidCount = PAGES.filter(p => p.status === 'void').length;
  const okCount = PAGES.filter(p => p.status === 'ok').length;
  const rawCount = PAGES.filter(p => p.status === 'raw').length;

  let html = `
    <div style="margin-bottom:1.5rem;">
      <h1 style="color:var(--accent);font-size:1.2rem;margin-bottom:0.5rem;">⚖️ EVIDENCE VAULT — AGENT NAVIGATOR</h1>
      <p style="color:var(--muted);font-size:0.8rem;">CASE-MACHERET-1997-2026 | Jus Cogens Integrity Protocol | ${PAGES.length} документов проиндексировано</p>
    </div>
    <div class="stats-bar">
      <div class="stat-item"><strong style="color:var(--ok)">${okCount}</strong> Live HTML</div>
      <div class="stat-item"><strong style="color:var(--warn)">${rawCount}</strong> Raw/MD</div>
      <div class="stat-item"><strong style="color:var(--void)">${voidCount}</strong> Требует публикации</div>
      <div class="stat-item"><strong>${PAGES.length}</strong> Всего</div>
    </div>
  `;

  Object.entries(groups).forEach(([grp, pages]) => {
    html += `<h2 style="font-size:0.8rem;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin:1.5rem 0 0.75rem;">${grp}</h2>`;
    html += '<div class="index-grid">';
    pages.forEach(p => {
      const cls = p.status;
      const statusLabel = { ok: 'LIVE', raw: 'RAW→HTML', void: '404' }[cls];
      html += `<div class="index-card ${cls}" onclick="navigateTo('${p.id}')">
        <div class="card-status">${statusLabel}</div>
        <div class="card-title">${p.title}</div>
        <div class="card-path">${p.path || '/'}</div>
        ${p.desc ? `<div style="font-size:0.65rem;color:var(--muted);margin-top:6px;">${p.desc}</div>` : ''}
      </div>`;
    });
    html += '</div>';
  });
  output.innerHTML = html;
}

// ════════════════════════════════════════════
// SIDEBAR BUILDER
// ════════════════════════════════════════════
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const groups = {};
  PAGES.forEach(p => {
    if (!groups[p.group]) groups[p.group] = [];
    groups[p.group].push(p);
  });

  let html = '';
  Object.entries(groups).forEach(([grp, pages]) => {
    html += `<div class="sidebar-group">
      <div class="sidebar-group-title">▸ ${grp}</div>`;
    pages.forEach(p => {
      const dotClass = { ok: 'dot-ok', raw: 'dot-raw', void: 'dot-void' }[p.status];
      html += `<a class="nav-item" data-id="${p.id}" onclick="navigateTo('${p.id}')" href="javascript:void(0)">
        <span class="dot ${dotClass}"></span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.title}</span>
        <span class="nav-status">${p.status === 'ok' ? '✓' : p.status === 'raw' ? '↗' : '404'}</span>
      </a>`;
    });
    html += '</div>';
  });
  sidebar.innerHTML = html;

  // Update header stats
  document.getElementById('hdr-void').textContent = PAGES.filter(p=>p.status==='void').length + ' VOID';
  document.getElementById('hdr-ok').textContent = PAGES.filter(p=>p.status==='ok').length + ' LIVE';
}

// ════════════════════════════════════════════
// SEARCH
// ════════════════════════════════════════════
document.getElementById('search-input').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(el => {
    const title = el.querySelector('span').textContent.toLowerCase();
    el.style.display = (!q || title.includes(q)) ? '' : 'none';
  });
});

// ════════════════════════════════════════════
// COPY PATH
// ════════════════════════════════════════════
function copyPath() {
  if (!currentPage) return;
  const url = SITE + currentPage.path;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('[onclick="copyPath()"]');
    btn.textContent = '✓ COPIED';
    setTimeout(() => { btn.textContent = '⎘ COPY PATH'; }, 1500);
  });
}

// ════════════════════════════════════════════
// HASH-BASED ROUTING
// ════════════════════════════════════════════
function handleHash() {
  const hash = location.hash.slice(1);
  const page = PAGES.find(p => p.id === hash || p.path === hash);
  if (page) navigateTo(page.id);
  else navigateTo('home');
}

window.addEventListener('hashchange', handleHash);

// ════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════
buildSidebar();
handleHash();
if (!location.hash) navigateTo('home');
</script>
